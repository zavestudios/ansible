name: Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  build-and-scan:
    name: Build and Scan Ansible Container
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: zavestudios/platform-pipelines/.github/workflows/container-build.yml@95dc3be12e3915599f3f1b99c75864d4c8742c7e
    with:
      image_name: zavestudios/ansible
      dockerfile: Dockerfile
      push: false
      platforms: linux/amd64
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
